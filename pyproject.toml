[project]
name = "words-per-minute"
version = "1.0.1"
description = "A fullscreen gui program flashing words on screen with customizable speed"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENCE.txt" }
authors = [{ name = "Your Name", email = "your.email@example.com" }]
keywords = ["gui", "reading", "speed-reading", "training", "wpm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yourusername/Words-Per-Minute"
Issues = "https://github.com/yourusername/Words-Per-Minute/issues"
Repository = "https://github.com/yourusername/Words-Per-Minute"

[project.scripts]
wpm = "WPM.app:main"

[project.gui-scripts]
wpm-gui = "WPM.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/WPM"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "pyproject.toml",
  "README.md",
  "LICENCE.txt",
]
